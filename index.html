<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翔毅車業預定系統 v4.5</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --main: #5865F2; --bg: #121212; --card: #1e1e1e; --accent: #ff9900; --text: #eeeeee; --row-bg: #2a2a2a; }
        body { font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; max-width: 500px; margin: auto; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--accent); text-align: center; letter-spacing: 2px; margin-top: 0; }
        
        .dc-btn { background: #5865F2; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; transition: 0.3s; }
        .user-box { background: #2f3136; padding: 10px; border-radius: 8px; display: none; align-items: center; gap: 10px; margin-bottom: 15px; border: 1px solid #444; }
        .user-box img { border-radius: 50%; width: 35px; }

        label { display: block; margin-top: 15px; color: #aaa; font-size: 13px; font-weight: bold; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; box-sizing: border-box; background: #2a2a2a; color: white; outline: none; }
        
        input[readonly] { background: #1a1a1a !important; color: var(--accent); border: 1px dashed #555; cursor: not-allowed; font-weight: bold; font-size: 18px; text-align: center; }

        .btn-send { background: var(--accent); color: black; font-weight: bold; border: none; font-size: 16px; margin-top: 20px; cursor: pointer; }

        .checkbox-group { background: #2a2a2a; border-radius: 8px; padding: 5px; max-height: 450px; overflow-y: auto; border: 1px solid #444; margin-top: 8px; }
        .item-option { display: flex; flex-direction: column; padding: 12px; border-bottom: 1px solid #333; }
        .item-main { display: flex; align-items: center; cursor: pointer; }
        .item-main input[type="checkbox"] { width: auto; margin-right: 12px; }
        .price-tag { color: var(--accent); font-size: 12px; margin-left: auto; font-weight: bold; }
        
        .qty-control { display: none; align-items: center; gap: 8px; margin-top: 10px; padding: 12px; background: #111; border-radius: 8px; border: 1px solid #333; }
        .qty-btn { width: 36px; height: 36px; padding: 0; background: #444; border: none; color: white; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .qty-btn:hover { background: #555; }
        .qty-input { width: 80px !important; height: 36px !important; text-align: center; margin: 0 !important; padding: 0 !important; font-size: 18px; font-weight: bold; color: var(--accent); background: #222 !important; border: 1px solid #444 !important; }
        .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .max-hint { font-size: 11px; color: #777; margin-left: 5px; }

        .custom-price-input { margin-top: 10px; padding: 10px; background: #1a1a1a; border-left: 3px solid var(--accent); display: none; }
        
        .calc-hint { color: #fff; font-size: 13px; margin-top: 15px; background: rgba(255,153,0,0.08); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,153,0,0.2); line-height: 1.8; display: none; }
        .calc-hint b { color: var(--accent); font-size: 20px; }

        /* 管理者區域 */
        .admin-section { display: none; border-top: 2px dashed #444; margin-top: 30px; padding-top: 20px; }
        .cat-card { background: #1a1a1a; border: 1px solid #444; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 10px 12px; border-radius: 8px; margin-top: 8px; font-size: 13px; border: 1px solid #444; cursor: default; }
        .item-row.sortable-ghost { opacity: 0.4; background: var(--main); }
        .drag-handle { cursor: grab; color: #666; margin-right: 10px; font-size: 18px; user-select: none; }
        
        .item-info { flex: 1; display: flex; align-items: center; }
        .admin-btns { display: flex; gap: 8px; }
        .del-btn { width: auto; background: #e74c3c; padding: 6px 12px; font-size: 11px; cursor: pointer; border: none; margin: 0; color: white; }
        .edit-btn { width: auto; background: #3498db; padding: 6px 12px; font-size: 11px; cursor: pointer; border: none; margin: 0; color: white; }
        .webhook-btn { width: auto; background: #9b59b6; padding: 4px 8px; font-size: 10px; cursor: pointer; border: none; margin: 0; color: white; border-radius: 4px; }
        
        .mode-toggle { display: flex; gap: 4px; margin-bottom: 10px; }
        .mode-toggle button { flex: 1; font-size: 11px; padding: 8px; background: #444; border: none; cursor: pointer; margin: 0; }
        .mode-toggle button.active { background: var(--accent); color: black; font-weight: bold; }

        /* 自定義彈窗 */
        #custom-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2a2a2a; padding: 20px; border-radius: 10px; border: 2px solid var(--accent); z-index: 1000; box-shadow: 0 0 20px rgba(0,0,0,0.8); width: 85%; max-width: 320px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; }

        /* 營業統計專屬樣式 */
        .stat-section { border: 1px solid #444; background: #111; padding: 15px; border-radius: 10px; margin-top: 5px; }
        .stat-box { background: #1a1a1a; padding: 12px; border-radius: 8px; margin-top: 8px; border: 1px dashed var(--accent); font-size: 15px; line-height: 1.6; }
        .stat-history { background: #222; padding: 10px; border-radius: 6px; margin-top: 8px; font-size: 13px; border-left: 3px solid #555; }
        
        /* 後台頂部導覽列樣式 */
        .admin-nav { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 15px; }
        .admin-nav button { flex: 1; margin: 0; padding: 10px; font-size: 12px; font-weight: bold; transition: 0.2s; }

        /* 僅新增：員工帳號列表樣式 */
        .emp-list-item { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 10px 12px; border-radius: 8px; margin-top: 8px; font-size: 13px; border: 1px solid #444; }
        .emp-list-info { display: flex; flex-direction: column; gap: 3px; }

        /* 吐司訊息通知（Toast）動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translate(-50%, 0); }
            to { opacity: 0; transform: translate(-50%, -10px); }
        }
    </style>
</head>
<body>

<div class="modal-overlay" id="modal-overlay"></div>
<div id="custom-modal">
    <h4 id="modal-title" style="margin-top:0; color: var(--accent);">修改資訊</h4>
    <p id="modal-item-name" style="font-size:12px; color:#aaa; margin-bottom: 15px;"></p>
    <div id="modal-input-area"></div>
    <div style="display:flex; gap:10px; margin-top:20px;">
        <button id="modal-confirm" style="background:var(--accent); color:black; margin:0; font-weight:bold;">儲存</button>
        <button onclick="closeModal()" style="background:#555; margin:0">取消</button>
    </div>
</div>

<!-- 吐司訊息容器 -->
<div id="toast-container" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;"></div>

<div class="card">
    <h2>🏎️ 翔毅車業預定系統</h2>

    <!-- 前台預定介面 -->
    <div id="player-view">
        <button id="login-btn" class="dc-btn" onclick="loginDiscord()">連結 Discord 帳號验证</button>
        
        <div id="user-display" class="user-box">
            <img id="user-avatar" src="" alt="">
            <div style="display:flex; flex-direction:column;">
                <span id="user-name" style="font-weight:bold;"></span>
                <span id="user-id-display" style="font-size:10px; color:#888;"></span>
            </div>
        </div>

        <label>1. 選擇業務類別</label>
        <select id="pCat" onchange="updateItems()"><option value="">讀取中...</option></select>
        
        <label>2. 勾選服務項目</label>
        <div id="item-list" class="checkbox-group">
            <p style="color:#666; font-size:12px; text-align:center; padding:10px;">請先選擇類別</p>
        </div>
        
        <div id="calc-section" style="display:none;">
            <div id="total-calc-hint" class="calc-hint"></div>
            <label>3. 最終預定總金額 (已鎖定)</label>
            <input type="text" id="pPrice" readonly placeholder="請勾選項目以試算金額">
        </div>
        
        <button class="btn-send" id="submit-btn" onclick="sendOrder()">送出預定</button>

        <!-- 管理與員工後台入口分開 -->
        <div style="display: flex; justify-content: center; gap: 20px; margin-top:40px;">
            <p style="font-size: 10px; color: #444; text-align: center; cursor: pointer; margin: 0;" onclick="showLogin()">⚙️ 老闆後台管理</p>
            <p style="font-size: 10px; color: #444; text-align: center; cursor: pointer; margin: 0;" onclick="showEmpLogin()">⚙️ 員工後台登入</p>
        </div>
    </div>

    <!-- 老闆後台登入頁面 -->
    <div id="login-view" style="display:none;">
        <h3>老闆後台登入</h3>
        <input type="text" id="aUser" placeholder="老闆帳號">
        <input type="password" id="aPass" placeholder="老闆密碼">
        <button onclick="authAdmin()">登入</button>
        <button style="background:#444;" onclick="location.reload()">返回</button>
    </div>

    <!-- 員工後台登入頁面 -->
    <div id="emp-login-view" style="display:none;">
        <h3>員工後台登入</h3>
        <input type="text" id="eUser" placeholder="員工帳號">
        <input type="password" id="ePass" placeholder="員工密碼">
        <button onclick="authEmployee()">登入</button>
        <button style="background:#444;" onclick="location.reload()">返回</button>
    </div>

    <!-- 後台管理主介面 -->
    <div id="admin-view" class="admin-section">
        <!-- 後台分頁導航列 -->
        <div class="admin-nav">
            <button id="nav-btn-manage" onclick="switchAdminPage('manage')" style="background: var(--accent); color: black;">預定系統管理</button>
            <button id="nav-btn-stats" onclick="switchAdminPage('stats')" style="background: #2a2a2a; color: white;">營業統計管理</button>
            <button id="nav-btn-employees" onclick="switchAdminPage('employees')" style="background: #2a2a2a; color: white;">員工帳號管理</button>
        </div>

        <!-- 原有後台管理頁面 -->
        <div id="admin-page-manage">
            <div class="cat-card">
                <h4>1. 分類管理</h4>
                <input type="text" id="nCatName" placeholder="分類名稱">
                <input type="text" id="nCatWeb" placeholder="Webhook 網址">
                <button onclick="addCat()">新增分類</button>
            </div>
            <div class="cat-card">
                <h4>2. 項目管理</h4>
                <select id="aCatSelect"></select>
                <input type="text" id="nItemName" placeholder="項目名稱">
                <div class="mode-toggle">
                    <button id="modeSingle" class="active" onclick="setPriceMode('single')">固定價</button>
                    <button id="modeRetail" onclick="setPriceMode('retail')">零售</button>
                    <button id="modeRange" onclick="setPriceMode('range')">範圍</button>
                    <button id="modeCustom" onclick="setPriceMode('custom')">自填10%</button>
                </div>
                <div id="inputSingle"><input type="number" id="nItemPrice" placeholder="單價"></div>
                <div id="inputRetailExtra" style="display:none;"><input type="number" id="nItemMax" placeholder="數量上限 (例如：10)"></div>
                <div id="inputRange" style="display:none; display:flex; gap:5px;"><input type="number" id="nPriceMin" placeholder="最低">~<input type="number" id="nPriceMax" placeholder="最高"></div>
                <button onclick="addItem()" style="margin-top:10px">確認上架</button>
            </div>
            <div id="admin-list-container"></div>
        </div>

        <!-- 營業統計專屬獨立頁面 -->
        <div id="admin-page-stats" style="display: none;">
            <div class="stat-section">
                <h4 style="margin:0; color:var(--accent);">📈 營業統計管理</h4>
                <div class="stat-box">
                    <div style="font-weight:bold; color:#fff; border-bottom:1px solid #333; padding-bottom:5px; margin-bottom:5px;">本週數據輪迴 (週六 00:00 ~ 週五 23:59)</div>
                    <div>下單總次數：<span id="stat-count" style="color:var(--accent); font-weight:bold;">0</span> 次</div>
                    <div>總營業金額：<span id="stat-amount" style="color:#2ecc71; font-weight:bold;">$0</span></div>
                </div>
                <h5 style="margin:15px 0 5px 0; color:#aaa;">上一個時段紀錄 (保留3天查看)：</h5>
                <div id="stat-history-list"></div>
            </div>
        </div>

        <!-- 員工帳號管理專屬獨立頁面 -->
        <div id="admin-page-employees" style="display: none;">
            <div class="cat-card">
                <h4 style="margin-top:0; color:var(--accent);">新增員工帳號</h4>
                <input type="text" id="new-emp-user" placeholder="員工帳號 (登入用帳號)">
                <input type="password" id="new-emp-pass" placeholder="員工密碼">
                <input type="text" id="new-emp-nick" placeholder="員工暱稱 (顯示用)">
                <button onclick="addEmployee()" style="background:var(--accent); color:black; font-weight:bold; margin-top:10px;">新增員工</button>
            </div>
            <div class="cat-card">
                <h4 style="margin-top:0;">現有員工清單</h4>
                <div id="admin-emp-list-container">
                    <p style="color:#666; font-size:12px; text-align:center; padding:10px;">載入中...</p>
                </div>
            </div>
        </div>
        
        <!-- 登出/返回按鈕 -->
        <button style="background:#444; margin-top:20px;" onclick="location.reload()">返回前台</button>
    </div>
</div>

<script>
    const CLIENT_ID = '1496839420521742367'; 
    const REDIRECT_URI = window.location.href.split('#')[0]; 
    const firebaseConfig = {
        apiKey: "AIzaSyAO56gUfagEELFVpvu7cxKKfmO4Q165QlE",
        authDomain: "fivem-shop-7907b.firebaseapp.com",
        databaseURL: "https://fivem-shop-7907b-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "fivem-shop-7907b",
        storageBucket: "fivem-shop-7907b.firebasestorage.app",
        messagingSenderId: "640041446455",
        appId: "1:640041446455:web:6914a2d1b3545a6bf5a3b2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let storeData = {}, userData = null, currentMode = 'single';
    let empData = {}; // 用於暫存員工資料

    // 自定義吐司通知功能 (替換 blocked 掉的 alert)
    function showToast(msg, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.style.pointerEvents = 'auto';
        toast.style.background = type === 'error' ? '#e74c3c' : type === 'success' ? '#2ecc71' : '#333';
        toast.style.color = '#fff';
        toast.style.padding = '12px 24px';
        toast.style.borderRadius = '8px';
        toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.5)';
        toast.style.fontSize = '14px';
        toast.style.fontWeight = 'bold';
        toast.style.minWidth = '220px';
        toast.style.textAlign = 'center';
        toast.style.animation = 'fadeIn 0.3s forwards, fadeOut 0.3s 2.7s forwards';
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => {
            toast.remove();
        }, 3000);
    }

    // 自定義確認彈窗功能 (替換 blocked 掉的 confirm)
    function showCustomConfirm(title, message, callback) {
        const modal = document.getElementById('custom-modal');
        const overlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalItemName = document.getElementById('modal-item-name');
        const inputArea = document.getElementById('modal-input-area');
        const confirmBtn = document.getElementById('modal-confirm');

        modalTitle.innerText = title;
        modalItemName.innerText = message;
        inputArea.innerHTML = ''; // 清空輸入框區域

        confirmBtn.onclick = () => {
            callback();
            closeModal();
        };

        modal.style.display = 'block';
        overlay.style.display = 'block';
    }

    function loginDiscord() {
        window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
    }

    window.onload = () => {
        const hash = new URLSearchParams(window.location.hash.slice(1));
        const token = hash.get('access_token');
        if (token) {
            fetch('https://discord.com/api/users/@me', { headers: { authorization: `Bearer ${token}` } })
            .then(r => r.json()).then(res => {
                userData = res;
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('user-display').style.display = 'flex';
                document.getElementById('user-name').innerText = res.username;
                document.getElementById('user-id-display').innerText = `ID: ${res.id}`;
            });
        }
        db.ref('xiangyi_shop').on('value', s => { storeData = s.val() || {}; refreshUI(); });
        
        // 監聽員工資料變更
        db.ref('employees').on('value', s => {
            empData = s.val() || {};
            refreshEmpUI();
        });

        // 啟動營業統計監聽與過期自動清理
        if(typeof initBusinessStats === 'function') initBusinessStats();
    };

    function refreshUI() {
        const pC = document.getElementById('pCat'), aC = document.getElementById('aCatSelect'), aLC = document.getElementById('admin-list-container');
        pC.innerHTML = '<option value="">請選擇...</option>'; aC.innerHTML = '<option value="">請選擇...</option>';
        aLC.innerHTML = '';
        for (let catId in storeData) {
            const cat = storeData[catId];
            pC.innerHTML += `<option value="${catId}">${cat.name}</option>`;
            aC.innerHTML += `<option value="${catId}">${cat.name}</option>`;
            
            const catDiv = document.createElement('div');
            catDiv.className = 'cat-card';
            catDiv.innerHTML = `
                <div class="cat-header">
                    <div><b>${cat.name}</b><br><button class="webhook-btn" onclick="openWebhookModal('${catId}')">Webhook 設定</button></div>
                    <button class="del-btn" style="background:#555" onclick="deleteCategory('${catId}')">刪除分類</button>
                </div>
                <div id="list-${catId}" class="sortable-list"></div>
            `;
            aLC.appendChild(catDiv);

            const itemListDiv = catDiv.querySelector('.sortable-list');
            const itemsArray = Object.entries(cat.items || {}).map(([id, data]) => ({ id, ...data }));
            itemsArray.sort((a, b) => (a.order || 0) - (b.order || 0));
            itemsArray.forEach(it => {
                let priceLabel = '';
                if(it.type === 'single') priceLabel = `$${it.price}`;
                else if(it.type === 'retail') priceLabel = `$${it.price}/個 (上限:${it.max||'∞'})`;
                else if(it.type === 'range') priceLabel = `$${it.min}-${it.max}`;
                else priceLabel = '自填10%';

                const row = document.createElement('div');
                row.className = 'item-row'; row.dataset.id = it.id;
                row.innerHTML = `
                    <div class="item-info">
                        <span class="drag-handle">⠿</span>
                        <div><b>${it.name}</b> <span style="color:#888; font-size:11px;">(${priceLabel})</span></div>
                    </div>
                    <div class="admin-btns">
                        <button class="edit-btn" onclick="openEditModal('${catId}', '${it.id}')">編輯</button>
                        <button class="del-btn" onclick="deleteItem('${catId}', '${it.id}')">下架</button>
                    </div>
                `;
                itemListDiv.appendChild(row);
            });
            new Sortable(itemListDiv, { handle: '.drag-handle', animation: 150, onEnd: () => saveOrder(catId) });
        }
    }

    // 渲染現有員工列表的 UI
    function refreshEmpUI() {
        const container = document.getElementById('admin-emp-list-container');
        container.innerHTML = '';
        const entries = Object.entries(empData);
        if (entries.length === 0) {
            container.innerHTML = '<p style="color:#666; font-size:12px; text-align:center; padding:10px;">目前尚無設定任何員工帳號</p>';
            return;
        }
        entries.forEach(([id, info]) => {
            const row = document.createElement('div');
            row.className = 'emp-list-item';
            row.innerHTML = `
                <div class="emp-list-info">
                    <div><b>${info.nickname || '未設定暱稱'}</b></div>
                    <div style="color:#888; font-size:11px;">帳號: ${info.username} | 密碼: ${info.password}</div>
                </div>
                <div>
                    <button class="del-btn" onclick="deleteEmployee('${id}')">刪除</button>
                </div>
            `;
            container.appendChild(row);
        });
    }

    function openEditModal(catId, itemId) {
        const item = storeData[catId].items[itemId];
        const modal = document.getElementById('custom-modal'), overlay = document.getElementById('modal-overlay'), inputArea = document.getElementById('modal-input-area'), confirmBtn = document.getElementById('modal-confirm');
        document.getElementById('modal-title').innerText = "編輯項目設定";
        document.getElementById('modal-item-name').innerText = item.name;
        inputArea.innerHTML = '';

        if (item.type === 'retail') {
            inputArea.innerHTML = `
                <label>單價</label><input type="number" id="edit-price" value="${item.price}">
                <label>數量上限</label><input type="number" id="edit-max" value="${item.max || ''}" placeholder="不設限請留空">
            `;
            confirmBtn.onclick = () => {
                const p = document.getElementById('edit-price').value, m = document.getElementById('edit-max').value;
                db.ref(`xiangyi_shop/${catId}/items/${itemId}`).update({ price: p, max: m }).then(() => {
                    showToast('項目修改成功', 'success');
                }); 
                closeModal();
            };
        } else if (item.type === 'single') {
            inputArea.innerHTML = `<label>售價</label><input type="number" id="edit-price" value="${item.price}">`;
            confirmBtn.onclick = () => {
                const p = document.getElementById('edit-price').value;
                db.ref(`xiangyi_shop/${catId}/items/${itemId}`).update({ price: p }).then(() => {
                    showToast('項目修改成功', 'success');
                }); 
                closeModal();
            };
        } else if (item.type === 'range') {
            inputArea.innerHTML = `<label>最低</label><input type="number" id="edit-min" value="${item.min}"><label>最高</label><input type="number" id="edit-max" value="${item.max}">`;
            confirmBtn.onclick = () => {
                const min = document.getElementById('edit-min').value, max = document.getElementById('edit-max').value;
                db.ref(`xiangyi_shop/${catId}/items/${itemId}`).update({ min, max }).then(() => {
                    showToast('項目修改成功', 'success');
                }); 
                closeModal();
            };
        } else {
            inputArea.innerHTML = `<p style="font-size:12px; color:#888">自填項目只需設定名稱</p>`;
            confirmBtn.onclick = closeModal;
        }
        modal.style.display = 'block'; overlay.style.display = 'block';
    }

    function closeModal() { document.getElementById('custom-modal').style.display = 'none'; document.getElementById('modal-overlay').style.display = 'none'; }

    function updateItems() {
        const id = document.getElementById('pCat').value, listDiv = document.getElementById('item-list');
        listDiv.innerHTML = '';
        if (id && storeData[id].items) {
            document.getElementById('calc-section').style.display = 'block';
            const itemsArray = Object.entries(storeData[id].items).map(([id, data]) => ({ id, ...data }));
            itemsArray.sort((a, b) => (a.order || 0) - (b.order || 0));
            itemsArray.forEach(it => {
                let pt = (it.type==='custom') ? '自填總價' : (it.type==='retail') ? `$${it.price}/個` : (it.type==='range') ? `$${it.min}~${it.max}` : `$${it.price}`;
                let extraUI = '';
                if(it.type==='custom') {
                    extraUI = `<div class="custom-price-input" id="box-${it.id}"><input type="number" oninput="recalc()" placeholder="請輸入成交總額"></div>`;
                } else if(it.type==='retail') {
                    extraUI = `
                        <div class="qty-control" id="qty-box-${it.id}">
                            <span style="font-size:13px; color:#aaa">數量：</span>
                            <button class="qty-btn" onclick="changeQty('${it.id}', -1, ${it.max||99999})">-</button>
                            <input type="number" class="qty-input" id="qty-val-${it.id}" value="1" min="1" max="${it.max||99999}" oninput="validateQty('${it.id}', ${it.max||99999})">
                            <button class="qty-btn" onclick="changeQty('${it.id}', 1, ${it.max||99999})">+</button>
                            ${it.max ? `<span class="max-hint">(上限 ${it.max})</span>` : ''}
                        </div>`;
                }
                listDiv.innerHTML += `
                    <div class="item-option">
                        <label class="item-main">
                            <input type="checkbox" name="si" data-type="${it.type}" data-id="${it.id}" data-p="${it.price||0}" onchange="toggleExtra('${it.id}', '${it.type}', this.checked)" value="${it.name}">
                            <span>${it.name}</span>
                            <span class="price-tag">${pt}</span>
                        </label>
                        ${extraUI}
                    </div>`;
            });
        }
        recalc();
    }

    function validateQty(id, max) {
        const input = document.getElementById(`qty-val-${id}`);
        let v = parseInt(input.value);
        if (v > max) input.value = max;
        if (v < 1 || isNaN(v)) input.value = 1;
        recalc();
    }

    function changeQty(id, delta, max) {
        const input = document.getElementById(`qty-val-${id}`);
        let current = parseInt(input.value) || 1;
        current += delta;
        if (current >= 1 && current <= max) {
            input.value = current;
            recalc();
        }
    }

    function toggleExtra(id, type, checked) {
        if(type === 'custom') document.getElementById(`box-${id}`).style.display = checked ? 'block' : 'none';
        else if(type === 'retail') document.getElementById(`qty-box-${id}`).style.display = checked ? 'flex' : 'none';
        recalc();
    }

    function recalc() {
        let fixed = 0, customOrig = 0, retailTotal = 0;
        const sel = document.querySelectorAll('input[name="si"]:checked');
        if(!sel.length) { document.getElementById('total-calc-hint').style.display='none'; document.getElementById('pPrice').value=''; return; }
        
        sel.forEach(el => {
            const t = el.getAttribute('data-type'), id = el.getAttribute('data-id'), p = parseFloat(el.getAttribute('data-p')) || 0;
            if(t === 'custom') customOrig += parseFloat(document.querySelector(`#box-${id} input`).value) || 0;
            else if(t === 'retail') retailTotal += (p * (parseInt(document.getElementById(`qty-val-${id}`).value) || 1));
            else if(t === 'single') fixed += p;
        });
        const cFinal = Math.floor(customOrig * 0.1);
        const total = fixed + retailTotal + cFinal;
        document.getElementById('total-calc-hint').style.display = 'block';
        document.getElementById('total-calc-hint').innerHTML = `
            ${fixed > 0 ? `項目小計：$${fixed}<br>` : ''}
            ${retailTotal > 0 ? `零售小計：$${retailTotal}<br>` : ''}
            ${cFinal > 0 ? `自填抽成(10%)：$${cFinal}<br>` : ''}
            -------------------<br>總計金額：<b>$${total}</b>`;
        document.getElementById('pPrice').value = total;
    }

    async function generateOrderNo() {
        const now = new Date(), dateStr = (now.getMonth() + 1).toString().padStart(2, '0') + now.getDate().toString().padStart(2, '0');
        const snap = await db.ref('order_counters/' + dateStr).transaction(c => (c || 0) + 1);
        return `${dateStr}${now.getHours().toString().padStart(2, '0')}${now.getMinutes().toString().padStart(2, '0')}${snap.snapshot.val().toString().padStart(2, '0')}`;
    }

    async function sendOrder() {
        if (!userData) return showToast("請先登入 Discord", "error");
        const cid = document.getElementById('pCat').value, finalP = document.getElementById('pPrice').value, sel = document.querySelectorAll('input[name="si"]:checked');
        if (!cid || !sel.length) return showToast("請勾選預定項目", "error");
        const btn = document.getElementById('submit-btn');
        btn.disabled = true; btn.innerText = "送單中...";

        try {
            const orderNo = await generateOrderNo();
            let details = [];
            sel.forEach(el => {
                const t = el.getAttribute('data-type'), id = el.getAttribute('data-id'), p = parseFloat(el.getAttribute('data-p')) || 0;
                let info = el.value;
                if(t==='custom') { let v = document.querySelector(`#box-${id} input`).value || 0; info += ` ($${v} -> 抽$${Math.floor(v*0.1)})`; }
                else if(t==='retail') { let q = document.getElementById(`qty-val-${id}`).value; info += ` x${q} ($${p*q})`; }
                else info += ` ($${p})`;
                details.push(info);
            });
            await fetch(storeData[cid].webhook, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: "翔毅車業預定系統",
                    embeds: [{
                        title: `🆕 新預定單 #${orderNo}`, color: 16751104,
                        fields: [
                            { name: "👤 預定人", value: `<@${userData.id}>`, inline: true },
                            { name: "💰 總金額", value: `**$${finalP}**`, inline: true },
                            { name: "📋 服務明細", value: "```" + details.join("\n") + "```" }
                        ], footer: { text: "翔毅車業 · 預訂系統" }, timestamp: new Date().toISOString()
                    }]
                })
            });

            // 當顧客送出預定成功時，將該筆訂單金額與當下時間戳記寫入獨立的 'orders' 節點進行統計
            db.ref('orders').push({ price: parseInt(finalP) || 0, timestamp: Date.now() });

            showToast(`預定成功！編號：${orderNo}`, "success"); 
            setTimeout(() => { location.reload(); }, 1500);
        } catch (e) { 
            showToast("發送失敗，請聯繫管理員檢查 Webhook", "error"); 
            btn.disabled = false; btn.innerText = "送出預定"; 
        }
    }

    function setPriceMode(m) {
        currentMode = m;
        ['modeSingle','modeRetail','modeRange','modeCustom'].forEach(id => document.getElementById(id).classList.remove('active'));
        document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');
        document.getElementById('inputSingle').style.display = (m==='single' || m==='retail') ? 'block' : 'none';
        document.getElementById('inputRetailExtra').style.display = (m==='retail') ? 'block' : 'none';
        document.getElementById('inputRange').style.display = m==='range' ? 'flex' : 'none';
    }

    // 老闆登入頁面顯示
    function showLogin() { document.getElementById('player-view').style.display='none'; document.getElementById('login-view').style.display='block'; }
    
    // 員工登入頁面顯示
    function showEmpLogin() { document.getElementById('player-view').style.display='none'; document.getElementById('emp-login-view').style.display='block'; }
    
    // 老闆驗證邏輯
    function authAdmin() {
        if (document.getElementById('aUser').value==='pomelo' && document.getElementById('aPass').value==='0326') {
            document.getElementById('login-view').style.display='none';
            document.getElementById('admin-view').style.display='block';
            document.getElementById('nav-btn-manage').style.display = 'block'; // 確保老闆登入能看見管理選單頁面
            document.getElementById('nav-btn-employees').style.display = 'block'; // 確保老闆登入能看見員工帳號管理頁面
            switchAdminPage('manage'); // 預設進入後台時，顯示「預定系統管理」獨立頁面
            showToast('老闆歡迎回來！', 'success');
        } else {
            showToast('管理員登入失敗，請確認密碼是否正確！', 'error');

    }

    // 動態員工驗證邏輯 (比對資料庫資料)
    function authEmployee() {
        const inputUser = document.getElementById('eUser').value;
        const inputPass = document.getElementById('ePass').value;
        
        let found = false;
        let empNick = '';
        for (let id in empData) {
            if (empData[id].username === inputUser && empData[id].password === inputPass) {
                found = true;
                empNick = empData[id].nickname;
                break;

        if (found) {

            switchAdminPage('stats'); // 直接切換至獨立的「營業統計管理」分頁
            showToast(`${empNick} 員工歡迎回來！`, 'success');
        } else {
            showToast('員工登入失敗，請確認帳號或密碼是否正確！', 'error');
        }
    }

    // 新增員工帳號到 Firebase
    function addEmployee() {
        const username = document.getElementById('new-emp-user').value.trim();
        const password = document.getElementById('new-emp-pass').value.trim();
        const nickname = document.getElementById('new-emp-nick').value.trim();

        if (!username || !password || !nickname) {
            return showToast("請填寫完整資訊 (帳號、密碼及暱稱)", 'error');
        }

        // 檢查帳號是否重複
        for (let id in empData) {
            if (empData[id].username === username) {
                return showToast("此員工帳號已被使用，請更換一個", 'error');
            }
        }

        db.ref('employees').push({
            username: username,
            password: password,
            nickname: nickname
        }).then(() => {
            showToast("員工帳號新增成功！", 'success');
            document.getElementById('new-emp-user').value = '';
            document.getElementById('new-emp-pass').value = '';
            document.getElementById('new-emp-nick').value = '';
        }).catch(err => {
            showToast("新增失敗，請再試一次", 'error');
            console.error(err);
        });
    }

    // 刪除員工帳號（使用客製化 Modal 確認）
    function deleteEmployee(id) {
        const staffName = empData[id] ? empData[id].nickname : "該員工";
        showCustomConfirm("確定刪除員工？", `確定要刪除員工「${staffName}」的登入帳號嗎？`, () => {
            db.ref(`employees/${id}`).remove()
                .then(() => showToast("員工刪除成功！", 'success'))

    // 刪除分類（使用客製化 Modal 確認）
    function deleteCategory(id) {
        const catName = storeData[id] ? storeData[id].name : "該分類";
        showCustomConfirm("確定刪除分類？", `這將會一併移除「${catName}」下的所有服務項目，確定嗎？`, () => {
            db.ref(`xiangyi_shop/${id}`).remove()
                .then(() => showToast("分類已刪除", 'success'))

    // 下架項目（使用客製化 Modal 確認）
    function deleteItem(cid, iid) {
        const itemName = (storeData[cid] && storeData[cid].items && storeData[cid].items[iid]) ? storeData[cid].items[iid].name : "此項目";
        showCustomConfirm("確定下架項目？", `確定要將「${itemName}」從預定系統下架嗎？`, () => {
            db.ref(`xiangyi_shop/${cid}/items/${iid}`).remove()
                .then(() => showToast("項目已下架", 'success'))
                .catch(err => showToast("下架失敗", 'error'));

    function addCat() {
        const n = document.getElementById('nCatName').value, w = document.getElementById('nCatWeb').value;
        if(n && w) { 
            db.ref('xiangyi_shop').push({ name: n, webhook: w }).then(() => {
                showToast('分類新增成功', 'success');
            }); 
            document.getElementById('nCatName').value=''; 
            document.getElementById('nCatWeb').value=''; 
        } else {
            showToast('請輸入分類名稱及 Webhook 網址', 'error');
        }

    function addItem() {
        const id = document.getElementById('aCatSelect').value, n = document.getElementById('nItemName').value;
        if(!id || !n) return showToast('請填寫完整項目資訊', 'error');
        let d = { name: n, type: currentMode, order: Object.keys(storeData[id].items || {}).length };
        if(currentMode==='single' || currentMode==='retail') {
            d.price = document.getElementById('nItemPrice').value;
            if(!d.price) return showToast('請填寫價格', 'error');

            d.min=document.getElementById('nPriceMin').value;

            showToast('項目上架成功', 'success');
        }); 
        document.getElementById('nItemName').value='';
    }
    
    function saveOrder(cid) {
        const rows = document.getElementById(`list-${cid}`).querySelectorAll('.item-row'), updates = {};
        rows.forEach((r, i) => updates[`xiangyi_shop/${cid}/items/${r.dataset.id}/order`] = i);
        db.ref().update(updates);

    function openWebhookModal(cid) {

        document.getElementById('modal-title').innerText = "修改 Webhook";
        inputArea.innerHTML = `<input type="text" id="edit-webhook" value="${storeData[cid].webhook}">`;
        confirmBtn.onclick = () => { 
            db.ref(`xiangyi_shop/${cid}`).update({ webhook: document.getElementById('edit-webhook').value }).then(() => {
                showToast('Webhook 更改成功', 'success');

            closeModal(); 
        };
        modal.style.display = 'block'; overlay.style.display = 'block';
    }

    // 營業統計功能完整擴充函式
    function getThisSaturdayZero() {
        let now = new Date();
        let currentDay = now.getDay(); // 0 是週日，1~6 是週一到週六
        let diffToSaturday = currentDay === 6 ? 0 : (currentDay + 1); // 計算距離上一個週六過了幾天
        let sat = new Date(now);
        sat.setDate(now.getDate() - diffToSaturday);
        sat.setHours(0, 0, 0, 0);
        return sat.getTime();
    }

    function initBusinessStats() {
        db.ref('orders').on('value', snapshot => {
            let data = snapshot.val() || {};
            let thisSatStart = getThisSaturdayZero();
            
            let thisWeekCount = 0;
            let thisWeekAmount = 0;
            let pastPeriodOrders = {};

            for (let id in data) {
                let order = data[id];
                if (order.timestamp >= thisSatStart) {
                    thisWeekCount++;
                    thisWeekAmount += (parseInt(order.price) || 0);
                } else {
                    let ageMs = Date.now() - order.timestamp;
                    if (ageMs > 3 * 86400000) {
                        db.ref('orders/' + id).remove();
                    } else {
                        let dateKey = new Date(order.timestamp).toLocaleDateString('zh-TW');
                        if (!pastPeriodOrders[dateKey]) pastPeriodOrders[dateKey] = { count: 0, total: 0 };
                        pastPeriodOrders[dateKey].count++;
                        pastPeriodOrders[dateKey].total += (parseInt(order.price) || 0);
                    }
                }
            }

            document.getElementById('stat-count').innerText = thisWeekCount;
            document.getElementById('stat-amount').innerText = `$${thisWeekAmount}`;

            let historyHtml = '';
            let hasHistory = false;
            for (let date in pastPeriodOrders) {
                hasHistory = true;
                historyHtml += `<div class="stat-history">📅 <b>${date}</b> 紀錄時段：<br>下單次數：${pastPeriodOrders[date].count} 次 | 金額加總：$${pastPeriodOrders[date].total}</div>`;
            }
            if (!hasHistory) {
                historyHtml = '<p style="color:#666; font-size:12px; margin:5px 0;">目前暫無 3 天內的歷史保留紀錄</p>';
            }
            document.getElementById('stat-history-list').innerHTML = historyHtml;
        });
    }

    // 後台專用分頁切換控制邏輯
    function switchAdminPage(page) {
        const btnManage = document.getElementById('nav-btn-manage');
        const btnStats = document.getElementById('nav-btn-stats');
        const btnEmployees = document.getElementById('nav-btn-employees');

        const divManage = document.getElementById('admin-page-manage');
        const divStats = document.getElementById('admin-page-stats');
        const divEmployees = document.getElementById('admin-page-employees');

        // 初始化所有按鈕狀態
        btnManage.style.background = '#2a2a2a';
        btnManage.style.color = 'white';
        btnStats.style.background = '#2a2a2a';
        btnStats.style.color = 'white';
        btnEmployees.style.background = '#2a2a2a';
        btnEmployees.style.color = 'white';

        // 隱藏所有分頁
        divManage.style.display = 'none';
        divStats.style.display = 'none';
        divEmployees.style.display = 'none';

        if (page === 'manage') {
            divManage.style.display = 'block';
            btnManage.style.background = 'var(--accent)';
            btnManage.style.color = 'black';
        } else if (page === 'stats') {
            divStats.style.display = 'block';
            btnStats.style.background = 'var(--accent)';
            btnStats.style.color = 'black';
        } else if (page === 'employees') {
            divEmployees.style.display = 'block';
            btnEmployees.style.background = 'var(--accent)';
            btnEmployees.style.color = 'black';
        }
    }
