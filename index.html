<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>翔毅車業預定系統 v4.6</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --main: #5865F2; --bg: #121212; --card: #1e1e1e; --accent: #ff9900; --text: #eeeeee; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; max-width: 500px; margin: auto; border: 1px solid #333; }
        h2 { color: var(--accent); text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; box-sizing: border-box; }
        .btn-send { background: var(--accent); color: black; font-weight: bold; cursor: pointer; }
        .admin-section { display: none; border-top: 2px dashed #444; margin-top: 30px; padding-top: 20px; }
        .cat-card { background: #1a1a1a; border: 1px solid #444; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏎️ 翔毅車業預定系統</h2>

    <div id="player-view">
        <button id="login-btn" class="dc-btn" onclick="loginDiscord()">連結 Discord 帳號驗證</button>
        <div id="user-display" style="display:none; text-align:center; margin-bottom:20px;">帳號已連結</div>
        
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 40px;">
            <p style="font-size: 10px; color: #444; cursor: pointer;" onclick="showLogin('admin')">👑 老闆選單</p>
            <p style="font-size: 10px; color: #444; cursor: pointer;" onclick="showLogin('staff')">👤 員工登入</p>
        </div>
    </div>

    <div id="login-view" style="display:none;">
        <h3 id="login-title">登入</h3>
        <input type="text" id="aUser" placeholder="帳號">
        <input type="password" id="aPass" placeholder="密碼">
        <button onclick="authAdmin()">確認登入</button>
        <button style="background:#444;" onclick="location.reload()">返回</button>
    </div>

    <div id="admin-view" class="admin-section">
        <div class="cat-card">
            <h4>員工帳號管理</h4>
            <input type="text" id="nStaffId" placeholder="員工ID">
            <input type="password" id="nStaffPass" placeholder="員工密碼">
            <input type="text" id="nStaffNick" placeholder="員工暱稱">
            <button onclick="addStaff()" style="background:#27ae60">新增員工</button>
        </div>
        <button onclick="location.reload()" style="background:#e74c3c">登出</button>
    </div>
</div>

<script>
    const firebaseConfig = { /* 請填入您的 Firebase 設定 */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function showLogin(mode) {
        document.getElementById('player-view').style.display = 'none';
        document.getElementById('login-view').style.display = 'block';
        document.getElementById('login-view').dataset.mode = mode;
        document.getElementById('login-title').innerText = mode === 'admin' ? '老闆登入' : '員工登入';
    }

    function authAdmin() {
        const user = document.getElementById('aUser').value;
        const pass = document.getElementById('aPass').value;
        const mode = document.getElementById('login-view').dataset.mode;

        if (mode === 'admin') {
            if (user === 'pomelo' && pass === '0326') {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'block';
            } else { alert('老闆，密碼錯誤！'); }
        } else {
            db.ref('staff/' + user).once('value', s => {
                const data = s.val();
                if (data && data.pass === pass) {
                    alert('歡迎員工：' + data.nick);
                    // 這裡可以導向員工專用的管理頁面
                } else { alert('帳號或密碼錯誤'); }
            });
        }
    }

    function addStaff() {
        const id = document.getElementById('nStaffId').value;
        const pass = document.getElementById('nStaffPass').value;
        const nick = document.getElementById('nStaffNick').value;
        if(id && pass && nick) {
            db.ref('staff/' + id).set({ pass, nick });
            alert('員工新增成功');
        } else { alert('請填寫完整資訊'); }
    }
</script>
</body>
</html>
